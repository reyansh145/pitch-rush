<script>
/* Pitch Rush network adapter: provides claude.use('db' | 'user' | 'room') over a WebSocket
   so the game's online code runs unchanged against your own server (see server.js). */
(function () {
  const SERVER = window.PITCH_SERVER_URL || '';
  const mem = {};
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  };
  const rs = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, b => 'abcdefghijklmnopqrstuvwxyz0123456789'[b % 36]).join(''); };
  let uid = ls.get('pr_uid'), tok = ls.get('pr_tok');
  if (!uid || !tok) { uid = 'u' + rs(14); tok = rs(32); ls.set('pr_uid', uid); ls.set('pr_tok', tok); }

  let ws = null, open = false, welcomed = false, myPeer = null, rid = 0, waiters = [];
  const pend = new Map(), cache = {}, lis = {}, subd = new Set(), rms = {};

  const raw = m => { if (open && ws && ws.readyState === 1) { ws.send(JSON.stringify(m)); return true; } return false; };
  function req(m) {
    return new Promise((res, rej) => {
      if (!welcomed) return rej(new Error('offline'));
      const r = ++rid; m.r = r;
      const t = setTimeout(() => { pend.delete(r); rej(new Error('timeout')); }, 8000);
      pend.set(r, { res, rej, t });
      if (!raw(m)) { clearTimeout(t); pend.delete(r); rej(new Error('offline')); }
    });
  }
  const ready = ms => new Promise(res => {
    if (welcomed) return res();
    const t = setTimeout(res, ms);
    waiters.push(() => { clearTimeout(t); res(); });
  });

  function connect() {
    if (!SERVER) return;
    try { ws = new WebSocket(SERVER); } catch (e) { return; }
    ws.onopen = () => { open = true; raw({ t: 'hello', id: uid, tok }); };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
    ws.onclose = () => {
      open = false; welcomed = false;
      pend.forEach(p => { clearTimeout(p.t); p.rej(new Error('offline')); }); pend.clear();
      setTimeout(connect, 2000);
    };
    ws.onerror = () => {};
  }

  function snap(c) {
    const docs = [...(cache[c] || new Map())].map(([id, d]) => ({ id, exists: true, data: () => d }));
    return { docs, size: docs.length, empty: !docs.length };
  }
  const notify = c => (lis[c] || []).forEach(f => { try { f(snap(c)); } catch (e) { console.error(e); } });

  function onMsg(m) {
    if (m.t === 'welcome') {
      welcomed = true; myPeer = m.peer;
      subd.forEach(c => raw({ t: 'sub', c }));
      Object.values(rms).forEach(R => { raw({ t: 'join', room: R.wire }); if (Object.keys(R.mine).length) raw({ t: 'pres', room: R.wire, p: R.mine }); });
      waiters.splice(0).forEach(f => f());
    } else if (m.t === 'snap') { cache[m.c] = new Map(m.docs); notify(m.c); }
    else if (m.t === 'doc') {
      const c = cache[m.c] || (cache[m.c] = new Map());
      if (m.d === null) c.delete(m.id); else c.set(m.id, m.d);
      notify(m.c);
    } else if (m.t === 'ack') {
      const p = pend.get(m.r); if (!p) return;
      clearTimeout(p.t); pend.delete(m.r);
      m.ok ? p.res() : p.rej(new Error(m.err || 'error'));
    } else if (m.t === 'rj') {
      const R = rms[m.room]; if (!R) return;
      R.others = new Map(m.peers.map(p => [p.peer, { by: p.by, presence: p.presence }]));
      R.fire(R.others.size ? m.peers.map(p => R.peerObj(p.peer)) : [], [], []);
    } else if (m.t === 'rp') {
      const R = rms[m.room]; if (!R) return;
      const isNew = !R.others.has(m.peer);
      R.others.set(m.peer, { by: m.by, presence: m.presence });
      const o = R.peerObj(m.peer);
      R.fire(isNew ? [o] : [], [], isNew ? [] : [o]);
    } else if (m.t === 'rl') {
      const R = rms[m.room]; if (!R) return;
      const o = R.peerObj(m.peer); R.others.delete(m.peer); R.fire([], o ? [o] : [], []);
    }
  }

  function mkRoom(wire, label) {
    const R = { wire, mine: {}, others: new Map(), hs: new Set(), pend: {}, tm: null };
    R.peerObj = id => { const o = R.others.get(id); return o ? { peer: id, by: o.by, isMe: false, sameTab: false, kind: 'viewer', guest: false, presence: o.presence, updatedAt: Date.now() } : null; };
    const me = () => ({ peer: myPeer, by: uid, isMe: true, sameTab: true, kind: 'viewer', guest: false, presence: R.mine, updatedAt: Date.now() });
    const peers = () => [me()].concat([...R.others.keys()].map(R.peerObj));
    R.fire = (j, l, u) => { const ps = peers(); R.hs.forEach(f => { try { f({ peers: ps, joined: j, left: l, updated: u }); } catch (e) { console.error(e); } }); };
    R.api = {
      name: label,
      presence(patch) {
        for (const k in patch) { if (patch[k] === null) delete R.mine[k]; else R.mine[k] = patch[k]; R.pend[k] = patch[k]; }
        if (!R.tm) R.tm = setTimeout(() => { R.tm = null; const p = R.pend; R.pend = {}; raw({ t: 'pres', room: wire, p }); }, 33);
        R.fire([], [], [me()]);
        return Promise.resolve();
      },
      peers,
      onPeers(fn) { R.hs.add(fn); queueMicrotask(() => { const ps = peers(); fn({ peers: ps, joined: ps, left: [], updated: [] }); }); return () => R.hs.delete(fn); },
      connected: () => welcomed,
      leave() { raw({ t: 'leave', room: wire }); delete rms[wire]; R.hs.clear(); return Promise.resolve(); }
    };
    rms[wire] = R;
    return R;
  }

  const DB = {
    collection(c) {
      return {
        onSnapshot(next) {
          (lis[c] = lis[c] || new Set()).add(next);
          if (!subd.has(c)) { subd.add(c); raw({ t: 'sub', c }); }
          else if (cache[c]) queueMicrotask(() => next(snap(c)));
          return () => lis[c].delete(next);
        },
        doc(id) {
          return {
            set: d => req({ t: 'set', c, id, d }),
            update: d => req({ t: 'upd', c, id, d }),
            delete: () => req({ t: 'del', c, id })
          };
        }
      };
    }
  };

  let RM = null;
  async function use(n) {
    if (!SERVER) return null;
    if (!ws) connect();
    await ready(5000);
    if (!welcomed) return null;
    if (n === 'user') return { id: async () => uid, canEdit: () => false, isOwner: () => false };
    if (n === 'db') return DB;
    if (n === 'room') {
      if (!RM) {
        const lobby = mkRoom('__lobby', 'lobby');
        try { await req({ t: 'join', room: '__lobby' }); } catch (e) { delete rms.__lobby; return null; }
        RM = Object.assign({}, lobby.api, {
          async join(name) {
            const wire = 'r:' + name, R = mkRoom(wire, name);
            try { await req({ t: 'join', room: wire }); } catch (e) { delete rms[wire]; throw e; }
            return R.api;
          }
        });
      }
      return RM;
    }
    return null;
  }
  window.claude = { use };
})();

</script>

if(d&&(d[0]||d[1]))s=(dx*d[0]+dy*d[1])/dist-dist/1500;else s=((p.team?-dx:dx)/dist)*.6-dist/900;if(dist<60)s-=1;if(s>bs){bs=s;best=q}});
if(best){const dx=best.x+best.vx*10-ball.x,dy=best.y+best.vy*10-ball.y;kick(p,dx,dy,Math.min(11,3+Math.hypot(dx,dy)*.022))}}
function goTo(p,tx,ty,sp){const dx=tx-p.x,dy=ty-p.y,m=Math.hypot(dx,dy);if(m<4){p.dvx=p.dvy=0;return}p.dvx=dx/m*sp;p.dvy=dy/m*sp}
function humanOld(p){const d=inDir(),sp=(K.ShiftLeft||K.ShiftRight||sprint)?4.3:3.3;p.dvx=d[0]*sp;p.dvy=d[1]*sp;
const near=Math.hypot(ball.x-p.x,ball.y-p.y)<28&&p.cd<=0;
if(want.shoot&&near){let gx=R-ball.x,gy=GY-ball.y,gm=Math.hypot(gx,gy)||1;let dx,dy;if(d[0]||d[1]){dx=d[0]*.6+gx/gm*.4;dy=d[1]*.6+gy/gm*.4}else{dx=gx;dy=gy}kick(p,dx,dy,13)}
else if(want.pass&&near)pass(p,d);
if(want.tackle&&!(p.tk>0))tackle(p);want.shoot=want.pass=want.tackle=false}
function ai(p){const dB=Math.hypot(ball.x-p.x,ball.y-p.y),gX=p.team?L:R;
if(p.role==='gk'){const gx=p.team?R-28:L+28;goTo(p,gx,cl(ball.y,GY-GH-8,GY+GH+8),2.7);
if(dB<24&&p.cd<=0){kick(p,p.team?-1:1,rnd(-.8,.8),9)}return}
if(dB<22&&p.cd<=0){const dg=Math.hypot(gX-p.x,GY-p.y);let opp=1e9;P.forEach(q=>{if(q.team!==p.team)opp=Math.min(opp,Math.hypot(q.x-p.x,q.y-p.y))});
if(dg<300&&Math.random()<.05*(p.team?DA[diff]:1)){shoot(p,gX,GY+rnd(-1,1)*(p.team?[75,45,28][diff]:45));return}
if(opp<45&&Math.random()<.05){pass(p,null);return}
goTo(p,gX,GY+(p.y-GY)*.5,p.team?2.9:3.1)}
else if(chase[p.team]===p){goTo(p,ball.x+ball.vx*8,ball.y+ball.vy*8,p.team?3.0:3.2);if(p.team===1&&!(p.tk>0)&&dB<34&&Math.random()<.025*DA[diff])tackle(p)}
else goTo(p,cl(p.hx+(ball.x-W/2)*.35,L+20,R-20),cl(p.hy+(ball.y-GY)*.3,T+20,B-20),2.4)}
function integ(p){if(p.stun>0){p.stun--;p.dvx*=.15;p.dvy*=.15}p.vx+=(p.dvx-p.vx)*.18;p.vy+=(p.dvy-p.vy)*.18;p.x+=p.vx;p.y+=p.vy;
if(p.role==='gk'){p.x=cl(p.x,p.team?R-120:L+15,p.team?R-15:L+120);p.y=cl(p.y,GY-120,GY+120)}else{p.x=cl(p.x,L+10,R-10);p.y=cl(p.y,T+10,B-10)}
if(Math.hypot(p.vx,p.vy)>.5){const m=Math.hypot(p.vx,p.vy);p.fx=p.vx/m;p.fy=p.vy/m}}
function ballStep(){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;
const inMouth=Math.abs(ball.y-GY)<GH;
if(mode==='goal'){ball.x=cl(ball.x,L-26,R+26);if(ball.x<=L-26||ball.x>=R+26)ball.vx*=-.3;ball.y=cl(ball.y,GY-GH+6,GY+GH-6);return}
if(ball.y<T+7){ball.y=T+7;ball.vy=Math.abs(ball.vy)*.8}
if(ball.y>B-7){ball.y=B-7;ball.vy=-Math.abs(ball.vy)*.8}
if(ball.x<L){if(inMouth){scored(1)}else{ball.x=L+7;ball.vx=Math.abs(ball.vx)*.8}}
else if(ball.x>R){if(inMouth){scored(0)}else{ball.x=R-7;ball.vx=-Math.abs(ball.vx)*.8}}
const SK=P.find(q=>q.sk);P.forEach(p=>{if(mode!=='play'||p.cd>0||SK)return;const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);
if(d<19){const nx=dx/(d||1),ny=dy/(d||1);ball.x=p.x+nx*19;ball.y=p.y+ny*19;ball.vx+=(p.vx*1.25-ball.vx)*.4;ball.vy+=(p.vy*1.25-ball.vy)*.4}})}
function scored(t){score[t]++;mode='goal';gt=130;msg=(t?T1.code:T0.code)+' SCORES!';snd('goal')}
function endOld(){mode='end';const o=document.getElementById('ov');o.style.display='flex';
const r=score[0]>score[1]?'You win! 🏆':score[0]<score[1]?'Red wins this one':'Draw';
o.innerHTML='<h1>Full time</h1><p style="font-size:28px;color:#fff;font-weight:700">Blue '+score[0]+' – '+score[1]+' Red</p><p>'+r+'</p><button id="go2">Play again</button>';
document.getElementById('go2').onclick=start}
function nearest(t){let b=null,bd=1e9;P.forEach(p=>{if(p.team!==t||p.role==='gk')return;const d=Math.hypot(ball.x-p.x,ball.y-p.y);if(d<bd){bd=d;b=p}});return b}
function step(){if(ON==='g'){guestStep();return}
if(mode==='goal'){ballStep();if(--gt<=0){if(sudden){end();return}reset();mode='play';snd('whistle')}return}
if(mode!=='play')return;
if(sudden){frames=TOTAL}else if(++frames>=TOTAL){if(cfg.ko&&score[0]===score[1]){sudden=true}else{end();return}}
chase[0]=nearest(0);chase[1]=nearest(1);ctrl=ctrlV=chase[0];
const LI=localInput(),RI=ON?remoteInput():null;P.forEach(p=>{if(p.cd>0)p.cd--;if(p.tk>0)p.tk--;if(p.sc>0)p.sc--;if(p.sk)skillStep(p);else if(p===ctrl)human(p,LI);else if(ON&&p===chase[1])human(p,RI);else{ai(p);const s=STR[p.team]*(ON?1:p.team?DS[diff]:1);p.dvx*=s;p.dvy*=s}integ(p)});
ballStep()}

function draw(){
g.fillStyle='#2e8b3e';g.fillRect(0,0,W,H);
for(let i=0;i<10;i++){if(i%2){g.fillStyle='rgba(255,255,255,.05)';g.fillRect(L+i*(R-L)/10,T,(R-L)/10,B-T)}}
g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;
g.strokeRect(L,T,R-L,B-T);g.beginPath();g.moveTo(W/2,T);g.lineTo(W/2,B);g.stroke();
g.beginPath();g.arc(W/2,GY,60,0,7);g.stroke();
g.strokeRect(L,GY-110,120,220);g.strokeRect(R-120,GY-110,120,220);
g.strokeRect(L,GY-50,45,100);g.strokeRect(R-45,GY-50,45,100);
g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(W/2,GY,3,0,7);g.fill();
g.fillStyle='rgba(255,255,255,.18)';g.fillRect(L-26,GY-GH,26,GH*2);g.fillRect(R,GY-GH,26,GH*2);
g.strokeStyle='#fff';g.lineWidth=3;g.strokeRect(L-26,GY-GH,26,GH*2);g.strokeRect(R,GY-GH,26,GH*2);
if(!P.length)return;
const all=[...P].sort((a,b)=>a.y-b.y);
all.forEach(p=>{
g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(p.x,p.y+9,11,5,0,0,7);g.fill();
g.fillStyle=p.role==='gk'?(p.team?'#f1c40f':'#2ecc71'):KIT[p.team];
g.beginPath();g.arc(p.x,p.y,11,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
g.fillStyle='#fff';g.font='bold 10px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(p.num,p.x,p.y+.5);
if(p.sk)drawSkill(p);if(p===ctrlV&&mode==='play'){g.strokeStyle='#ffe14d';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,15,0,7);g.stroke();
g.fillStyle='#ffe14d';g.beginPath();g.moveTo(p.x,p.y-26);g.lineTo(p.x-6,p.y-35);g.lineTo(p.x+6,p.y-35);g.fill()}});
g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(ball.x,ball.y+5,6,3,0,0,7);g.fill();
g.fillStyle='#fff';g.strokeStyle='#222';g.lineWidth=1.5;g.beginPath();g.arc(ball.x,ball.y,6.5,0,7);g.fill();g.stroke();
const m=Math.min(90,Math.floor(frames/TOTAL*90));
g.fillStyle='rgba(8,20,13,.85)';g.beginPath();g.roundRect(W/2-110,4,220,26,13);g.fill();
g.fillStyle='#fff';g.font='bold 15px system-ui';g.textBaseline='middle';
g.textAlign='right';g.fillText(T0.code+' '+score[0],W/2-28,18);g.textAlign='left';g.fillText(score[1]+' '+T1.code,W/2+28,18);
g.textAlign='center';g.fillStyle='#ffe14d';g.fillText(cfg.solo?Math.ceil((TOTAL-frames)/60)+'s':sudden?'GG':m+'’',W/2,18);
if(ON){g.fillStyle='rgba(255,255,255,.85)';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(ON==='g'?'You are '+T1.code+' ← attacking left':'You are '+T0.code+' attacking right →',W/2,H-12)}if(mode==='goal'){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,GY-50,W,100);g.fillStyle='#fff';g.font='900 56px system-ui';g.fillText(msg,W/2,GY)}}

let last=0,acc=0;
function loop(t){const dt=Math.min(100,t-last);last=t;acc+=dt;while(acc>=16.667){step();acc-=16.667}if(ON==='h'&&mode!=='lobby')hostSend();else if(ON==='g'&&mode!=='lobby')guestSend();if(ON&&mode!=='lobby'&&++ck%30===0)presCheck();draw();requestAnimationFrame(loop)}
build();reset();showMenu();requestAnimationFrame(loop);
</script>
</body>
